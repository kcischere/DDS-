<div style="display: flex; justify-content: center; align-items: center; min-height: 85vh; padding: 16px;">
  <mat-card style="width: 100%; max-width: 400px; padding: 16px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
    <mat-card-header style="justify-content: center; margin-bottom: 16px;">
      <mat-card-title style="font-size: 22px; font-weight: 500; color: #3f51b5;">
        ERDMS Account Registration
      </mat-card-title>
    </mat-card-header>
    
    <mat-card-content style="display: flex; flex-direction: column; gap: 16px;">
      <div *ngIf="errorMessage" style="background-color: #ffebee; color: #c62828; padding: 12px; border-radius: 4px; font-size: 13px; border-left: 4px solid #e53935;">
        {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" style="background-color: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 4px; font-size: 13px; border-left: 4px solid #4caf50;">
        {{ successMessage }}
      </div>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Full Name</mat-label>
        <input matInput [(ngModel)]="name" placeholder="Enter your full name" />
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Username</mat-label>
        <input matInput [(ngModel)]="username" placeholder="Choose a username" />
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Password</mat-label>
        <input matInput type="password" [(ngModel)]="password" placeholder="Create a password" />
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions style="display: flex; flex-direction: column; gap: 12px; align-items: center; padding-top: 16px;">
      <button mat-raised-button color="primary" style="width: 100%; height: 44px;" (click)="onRegister()">
        Sign Up
      </button>
      <a routerLink="/login" style="color: #3f51b5; text-decoration: none; font-size: 14px; margin-top: 8px;">
        Already have an account? Sign In
      </a>
    </mat-card-actions>
  </mat-card>
</div>
