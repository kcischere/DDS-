<div class="logs-container">
  <h1 class="logs-title">Logs & Audit Trail</h1>

  <!-- Filter -->
  <mat-card class="filter-card">
    <mat-card-content>
      <mat-form-field appearance="outline">
        <mat-label>Filter by Action</mat-label>
        <mat-select [(ngModel)]="selectedAction" (ngModelChange)="filterLogs()">
          <mat-option *ngFor="let opt of actionOptions" [value]="opt.value">
            {{ opt.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <div *ngIf="loading" class="loading">Loading...</div>

  <mat-card *ngIf="!loading" class="table-card">
    <mat-card-content>
      <table mat-table [dataSource]="filteredLogs" class="logs-table">

        <ng-container matColumnDef="created_at">
          <th mat-header-cell *matHeaderCellDef>Timestamp</th>
          <td mat-cell *matCellDef="let log">{{ log.created_at | date:'medium' }}</td>
        </ng-container>

        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>User</th>
          <td mat-cell *matCellDef="let log">{{ log.username }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let log">
            <span [class]="'badge badge-' + log.action.toLowerCase().replace('_', '-')">
              {{ log.action }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="details">
          <th mat-header-cell *matHeaderCellDef>Details</th>
          <td mat-cell *matCellDef="let log">{{ log.details }}</td>
        </ng-container>

        <ng-container matColumnDef="ip_address">
          <th mat-header-cell *matHeaderCellDef>IP Address</th>
          <td mat-cell *matCellDef="let log">{{ log.ip_address }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <p *ngIf="filteredLogs.length === 0" class="empty-msg">No logs found.</p>
    </mat-card-content>
  </mat-card>
</div>
