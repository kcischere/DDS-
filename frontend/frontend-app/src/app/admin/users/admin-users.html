<mat-toolbar color="primary">
  <span>ERDMS</span>
  <span style="flex:1"></span>
  <a mat-button routerLink="/admin/users" style="color:white">👥 Users</a>
  <a mat-button routerLink="/admin/documents" style="color:white">📁 Documents</a>
  <a mat-button routerLink="/admin/information" style="color:white">🪪 Information</a>
  <a mat-button routerLink="/admin/status" style="color:white">📊 Status</a>
  <a mat-button routerLink="/admin/myinfo" style="color:white">👤 My Info</a>
  <button mat-button style="color:white" (click)="logout()">Logout</button>
</mat-toolbar>

<div style="padding: 24px; max-width: 800px; margin: auto;">
  <mat-card>
    <mat-card-header><mat-card-title>Add New User</mat-card-title></mat-card-header>
    <mat-card-content style="padding-top: 16px;">
      <div *ngIf="errorMsg" style="background:#ffebee;color:#c62828;padding:10px;border-radius:4px;margin-bottom:12px;border-left:4px solid #e53935;">{{ errorMsg }}</div>
      <mat-form-field appearance="outline" style="width:100%;margin-bottom:8px;"><mat-label>Name</mat-label><input matInput [(ngModel)]="name" /></mat-form-field>
      <mat-form-field appearance="outline" style="width:100%;margin-bottom:8px;"><mat-label>Username</mat-label><input matInput [(ngModel)]="username" /></mat-form-field>
      <mat-form-field appearance="outline" style="width:100%;margin-bottom:8px;"><mat-label>Password</mat-label><input matInput type="password" [(ngModel)]="password" /></mat-form-field>
      <mat-form-field appearance="outline" style="width:100%;">
        <mat-label>Role</mat-label>
        <select matNativeControl [(ngModel)]="role">
          <option value="User">User</option>
          <option value="Admin">Admin</option>
        </select>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="addUser()">Add User</button>
      <button mat-stroked-button (click)="getUsers()" style="margin-left:8px;">Refresh</button>
    </mat-card-actions>
  </mat-card>

  <mat-card style="margin-top:24px;">
    <mat-card-header><mat-card-title>All Users</mat-card-title></mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="users" style="width:100%;">
        <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef>ID</th><td mat-cell *matCellDef="let u">{{ u.id }}</td></ng-container>
        <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Name</th><td mat-cell *matCellDef="let u">{{ u.name }}</td></ng-container>
        <ng-container matColumnDef="username"><th mat-header-cell *matHeaderCellDef>Username</th><td mat-cell *matCellDef="let u">{{ u.username }}</td></ng-container>
        <ng-container matColumnDef="role"><th mat-header-cell *matHeaderCellDef>Role</th><td mat-cell *matCellDef="let u">{{ u.role }}</td></ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let u"><span [style.color]="u.status==='active'?'green':'red'">{{ u.status }}</span></td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let u">
            <button mat-stroked-button (click)="editUser(u)" style="margin-right:4px;">Update</button>
            <button mat-raised-button *ngIf="u.status==='active'" color="warn" (click)="disableUser(u.id)" style="margin-right:4px;">Disable</button>
            <button mat-raised-button *ngIf="u.status==='inactive'" color="primary" (click)="enableUser(u.id)" style="margin-right:4px;">Enable</button>
            <button mat-raised-button color="warn" (click)="softDeleteUser(u.id)">Delete</button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="['id','name','username','role','status','actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['id','name','username','role','status','actions'];"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
