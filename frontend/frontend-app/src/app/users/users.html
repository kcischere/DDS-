<mat-toolbar color="primary">
  <span>User Management System</span>
  <span style="flex:1"></span>
  <a mat-button routerLink="/users" style="color:white">👥 Users</a>
  <a mat-button routerLink="/documents" style="color:white">📁 Documents</a>
  <button mat-button style="color:white" (click)="logout()">Logout</button>
</mat-toolbar>

<div style="padding: 24px; max-width: 700px; margin: auto;">
  <mat-card>
    <mat-card-header><mat-card-title>Add New User</mat-card-title></mat-card-header>
    <mat-card-content style="padding-top: 16px;">
      <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 8px;"><mat-label>Name</mat-label><input matInput [(ngModel)]="name" /></mat-form-field>
      <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 8px;"><mat-label>Username</mat-label><input matInput [(ngModel)]="username" /></mat-form-field>
      <mat-form-field appearance="outline" style="width: 100%;"><mat-label>Password</mat-label><input matInput type="password" [(ngModel)]="password" /></mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="addUser()">Add User</button>
      <button mat-stroked-button (click)="getUsers()" style="margin-left: 8px;">Refresh</button>
    </mat-card-actions>
  </mat-card>

  <mat-card style="margin-top: 24px;">
    <mat-card-content>
      <table mat-table [dataSource]="users" style="width: 100%;">
        <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef>ID</th><td mat-cell *matCellDef="let user">{{ user.id }}</td></ng-container>
        <ng-container matColumnDef="name"><th mat-header-cell *matHeaderCellDef>Name</th><td mat-cell *matCellDef="let user">{{ user.name }}</td></ng-container>
        <ng-container matColumnDef="role"><th mat-header-cell *matHeaderCellDef>Role</th><td mat-cell *matCellDef="let user">{{ user.role }}</td></ng-container>
        <ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let user"><span [style.color]="user.status === 'active' ? 'green' : 'red'">{{ user.status }}</span></td></ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let user">
            <button mat-stroked-button (click)="editUser(user)">Update</button>
            <button mat-raised-button *ngIf="user.status === 'active'" color="warn" (click)="disableUser(user.id)">Disable</button>
            <button mat-raised-button *ngIf="user.status === 'inactive'" color="primary" (click)="enableUser(user.id)">Enable</button>
            <button mat-raised-button color="warn" (click)="softDeleteUser(user.id)">Delete</button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="['id','name','role','status','actions']"></tr>
        <tr mat-row *matRowDef="let row; columns: ['id','name','role','status','actions'];"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
