<div style="display: flex; justify-content: center; align-items: center; min-height: 85vh; padding: 16px;">
  <mat-card style="width: 100%; max-width: 400px; padding: 16px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
    <mat-card-header style="justify-content: center; margin-bottom: 16px;">
      <mat-card-title style="font-size: 22px; font-weight: 500; color: #3f51b5;">
        ERDMS Sign In
      </mat-card-title>
    </mat-card-header>
    
    <mat-card-content style="display: flex; flex-direction: column; gap: 16px;">
      <div *ngIf="errorMessage" 
           style="background-color: #ffebee; color: #c62828; padding: 12px; border-radius: 4px; font-size: 13px; font-weight: 500; border-left: 4px solid #e53935;">
        {{ errorMessage }}
      </div>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Username</mat-label>
        <input matInput 
               [(ngModel)]="username" 
               name="username"
               placeholder="Enter your username" 
               (keyup.enter)="onLogin()" />
      </mat-form-field>

      <mat-form-field appearance="outline" style="width: 100%;">
        <mat-label>Password</mat-label>
        <input matInput 
               type="password" 
               [(ngModel)]="password" 
               name="password"
               placeholder="Enter your password" 
               (keyup.enter)="onLogin()" />
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions style="justify-content: flex-end; padding-top: 16px;">
      <button mat-raised-button 
              color="primary" 
              style="width: 100%; height: 44px; font-size: 15px;" 
              (click)="onLogin()">
        Sign In
      </button>
      
<div style="text-align: center; margin-top: 16px;">
<a routerLink="/register" style="color: #3f51b5; text-decoration: none; font-size: 14px; font-weight: 500;">
    Don't have an account? Sign Up
  </a>
</div>
    </mat-card-actions>
  </mat-card>
</div>
